[project]
name = "cairn-fieldlab-tools"
version = "0.1.0"
description = "Schema, validation and analysis tooling for cairn-fieldlab packet logs"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
# The validator is deliberately dependency-free: it runs on a field laptop
# with nothing installed but Python. Analysis dependencies come later, and
# only for the analysis tools.
dependencies = []

[project.scripts]
validate-csv = "fieldlab.cli:main"
synth-log = "fieldlab.cli:synth_main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
