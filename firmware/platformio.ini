; Logger firmware for the Seeed XIAO ESP32-C6.
;
; The library is pinned to an exact commit, never a branch. A floating
; reference means the firmware that produced a given day's measurements can no
; longer be rebuilt, and reproducibility is most of the reason to work this way.

[env:xiao_esp32c6]
; NOT the official `espressif32` platform. As of 7.0.1 it still ships Arduino
; core 2.0.17, which has no ESP32-C6 support at all — it fails outright with
; "This board doesn't support arduino framework!". The pioarduino fork is the
; community platform that carries Arduino core 3.x, and it is what every C6
; board needs today. Pinned, for the same reason the library is.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200

build_flags =
  -DCORE_DEBUG_LEVEL=0

lib_deps =
  https://github.com/offgridevices/Meshtastic-arduino.git#4d08b45e4b6d3d13ed05368c7255f9f9b958af73
  olikraus/U8g2@^2.35.19
